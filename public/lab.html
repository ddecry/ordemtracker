<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratório | Ordem Tracker</title>
<link rel="icon" href="/rn-branco.png">
<style>
/* painel do laboratório: só no computador, pra ver os dados extras que estão sendo juntados */
:root{--bg:#0e0e0e;--panel:#171717;--panel2:#202020;--line:#262626;--tx:#ededed;--mut:#8a8a8a;--tw:#9146ff;--yt:#ff2b2b;--ok:#53fc18}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px}
header .mut{font-size:13px}
.mut{color:var(--mut)}
main{padding:20px 24px 40px;display:grid;gap:18px;max-width:1300px;margin:0 auto}
h2{margin:0 0 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{background:var(--panel2);border-radius:10px;padding:10px 12px;min-width:0}
.st span{display:block;font-size:12px;color:var(--mut)}
.st b{font-size:22px;font-variant-numeric:tabular-nums}
.st i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:2px}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tw h2{color:var(--tw)}.yt h2{color:var(--yt)}
.aviso{font-size:12px;color:var(--mut);margin:10px 0 0}
svg{width:100%;height:180px;display:block}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.vazio{color:var(--mut);font-size:14px}
@media (max-width:800px){.dois{grid-template-columns:1fr}main,header{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header><h1>Laboratório</h1><span class="mut" id="ep">-</span><span class="mut" id="atual" style="margin-left:auto">-</span></header>
<main>
  <section class="box"><h2>Audiência e engajamento</h2><div class="grid" id="geral"></div><p class="aviso" id="retAviso"></p></section>
  <div class="dois">
    <section class="box tw"><h2>Twitch</h2><div class="grid" id="tw"></div></section>
    <section class="box yt"><h2>YouTube</h2><div class="grid" id="yt"></div></section>
  </div>
  <section class="box"><h2>Ranking na Twitch</h2><div class="grid" id="melhor"></div><div id="graf"></div>
    <div class="leg"><span><i style="background:var(--ok)"></i>Categoria</span><span><i style="background:var(--tw)"></i>Lives em português</span><span><i style="background:var(--mut)"></i>Mundo</span></div></section>
  <section class="box"><h2>Retenção por hora</h2><div id="ret"></div></section>
  <p class="aviso">"Novos no histórico" compara com quem já falou em lives acompanhadas antes. Na primeira live todo mundo conta como novo; o número passa a valer a partir da próxima.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const f = n => n == null ? "-" : Number(n).toLocaleString("pt-BR");
const hm = q => new Date(q).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const st = (rot, v, nota) => `<div class="st"><span>${rot}</span><b>${v}</b>${nota ? `<i>${nota}</i>` : ""}</div>`;
// gráfico das posições no ranking: 1º em cima
function grafico(l) {
  if (l.length < 2) return `<p class="vazio">Juntando leituras…</p>`;
  const W = 1000, H = 180, P = 22, t0 = new Date(l[0].q), t1 = new Date(l.at(-1).q);
  const max = Math.max(10, ...l.flatMap(r => [r.pt, r.geral, r.categoria]).filter(Boolean));
  const x = q => P + (new Date(q) - t0) / ((t1 - t0) || 1) * (W - 2 * P), y = p => P + (p - 1) / (max - 1) * (H - 2 * P);
  const linha = (k, cor) => { const pts = l.filter(r => r[k]).map(r => `${x(r.q).toFixed(1)},${y(r[k]).toFixed(1)}`).join(" "); return pts ? `<polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="2.5" vector-effect="non-scaling-stroke"/>` : ""; };
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <text x="0" y="${P + 4}" fill="#8a8a8a" font-size="11">1º</text><text x="0" y="${H - P + 4}" fill="#8a8a8a" font-size="11">${max}º</text>
    ${linha("geral", "#8a8a8a")}${linha("pt", "#9146ff")}${linha("categoria", "#53fc18")}</svg>
    <div class="leg"><span>${hm(l[0].q)}</span><span style="margin-left:auto">${hm(l.at(-1).q)}</span></div>`;
}
async function atualiza() {
  let d; try { d = await (await fetch("/api/lab" + location.search)).json(); } catch { return; }
  $("ep").textContent = (d.titulo || d.episodio || "nenhuma live").replace(/\s*\|.*$/, "");
  $("atual").textContent = "atualizado às " + new Date().toLocaleTimeString("pt-BR");
  const x = d.extras || {}, T = x.twitch || {}, Y = x.youtube || {}, r = d.retencao, e = d.engajamento || {};
  $("geral").innerHTML = [
    st("Pico", f(r?.pico), r?.minutosAtePico != null ? r.minutosAtePico + " min depois do começo" : ""),
    st("Agora em relação ao pico", r ? f(r.fimDoPico) + "%" : "-"),
    st("Mensagens/min por mil viewers", f(e.msgsPorMinutoPorMilViewers)),
    st("Pessoas no chat por mil viewers", f(e.pessoasNoChatPorMilViewers)),
    st("Seguidores Twitch por mil viewers", f(e.seguidoresTwitchPorMilViewers)),
  ].join("");
  $("tw").innerHTML = [
    st("Mensagens", f(T.msgs)), st("Pessoas no chat", f(T.pessoas)),
    st("Primeira vez no canal", f(T.primeiraVez), "marca oficial da Twitch"),
    st("Novos no histórico", f(T.novosNoHistorico)),
    st("Inscritos falando", f(T.inscritosFalando), T.pessoas ? Math.round(T.inscritosFalando / T.pessoas * 100) + "% de quem fala" : ""),
    st("Inscrições novas", f(T.subs)), st("Renovações", f(T.resubs)), st("Com Prime", f(T.prime)),
    st("Presenteadas", f(T.presentes)), st("Bits", f(T.bits)),
    st("Raids", f(T.raids?.length), T.raids?.length ? T.raids.map(r => `${r.de} (${f(r.viewers)})`).join(", ") : ""),
  ].join("");
  const sc = Object.entries(Y.superChats || {}).map(([m, v]) => `${v.n}× ${m} ${v.total.toLocaleString("pt-BR", { maximumFractionDigits: 2 })}`).join(", ");
  const ss = Object.entries(Y.superStickers || {}).map(([m, v]) => `${v.n}× ${m} ${v.total.toLocaleString("pt-BR", { maximumFractionDigits: 2 })}`).join(", ");
  $("yt").innerHTML = [
    st("Mensagens", f(Y.msgs)), st("Pessoas no chat", f(Y.pessoas)),
    st("Novos no histórico", f(Y.novosNoHistorico)),
    st("Membros falando", f(Y.membrosFalando), Y.pessoas ? Math.round(Y.membrosFalando / Y.pessoas * 100) + "% de quem fala" : ""),
    st("Membros novos", f(Y.membrosNovos)), st("Membros presenteados", f(Y.membrosPresenteados)),
    st("Super Chats", f(Object.values(Y.superChats || {}).reduce((s, v) => s + v.n, 0)), sc),
    st("Super Stickers", f(Object.values(Y.superStickers || {}).reduce((s, v) => s + v.n, 0)), ss),
  ].join("");
  const m = x.melhor || {}, ult = (x.ranking || []).at(-1) || {};
  const pos = (k, rot) => st(rot, m[k] ? m[k].pos + "º" : "-", (m[k] ? "melhor, às " + hm(m[k].q) : "") + (ult[k] ? ", agora " + ult[k] + "º" : ""));
  $("melhor").innerHTML = [pos("categoria", "Na categoria"), pos("pt", "Lives em português"), pos("geral", "No mundo")].join("");
  $("graf").innerHTML = grafico(x.ranking || []);
  $("ret").innerHTML = r?.porHora?.length
    ? `<table>${r.porHora.map(h => `<tr><td>Fim da ${h.hora}ª hora</td><td>${f(h.viewers)}, ${f(h.doPico)}% do pico</td></tr>`).join("")}</table>`
    : `<p class="vazio">Aparece quando a live completar a primeira hora.</p>`;
}
atualiza(); setInterval(atualiza, 15000);
</script>
</body>
</html>
